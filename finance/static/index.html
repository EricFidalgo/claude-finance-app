<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money</title>
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<script src="lock.js" data-name="Money" data-setup="./run.sh password"></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1 id="title">Today</h1>
    <div class="top-actions">
      <a class="icon-btn" href="#plan" aria-label="Plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </a>
      <button class="pill" id="ask" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>
        Ask Claude
      </button>
    </div>
  </div>
  <div class="sync-row">
    <span id="synced" class="synced">Loading…</span>
    <button class="link-btn" id="sync" type="button">Sync now</button>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<nav class="tabs" aria-label="Screens">
  <a href="#today" data-tab="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
    <span>Today</span>
  </a>
  <a href="#spending" data-tab="spending">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
    <span>Spending</span>
  </a>
  <a href="#bills" data-tab="bills">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
    <span>Bills</span>
  </a>
  <a href="#money" data-tab="money">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
    <span>Money</span>
  </a>
  <a href="#investing" data-tab="investing">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/></svg>
    <span>Investing</span>
  </a>
</nav>
</body>
</html>
