services:
  app:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: finance-tracker
    container_name: finance-tracker
    restart: unless-stopped
    # Published on the host's loopback only. Phone access goes through `tailscale serve`.
    ports:
      - "127.0.0.1:8787:8787"  # the app
      - "127.0.0.1:8765:8765"  # Plaid Link page, only while `./run.sh link` runs
    volumes:
      - ./data:/app/data
    # Values pass through by name from the shell that runs compose (run.sh exports them).
    environment:
      - PLAID_CLIENT_ID
      - PLAID_SECRET
      - PLAID_SANDBOX_SECRET
      - TZ=${TZ:-America/New_York}
